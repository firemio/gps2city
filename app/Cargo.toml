[package]
name = "geo_location"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.7"
actix-files = "0.6.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
geojson = "0.22"
geo = "0.24"
tokio = { version = "1", features = ["full"] }
actix-cors = "0.6"
indicatif = "0.16.2"
